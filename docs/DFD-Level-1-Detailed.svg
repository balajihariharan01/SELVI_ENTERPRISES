<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <!-- White Background -->
  <rect width="1100" height="850" fill="white"/>
  
  <!-- Title -->
  <text x="550" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="black">
    Level 1: Data Flow Diagram
  </text>
  <text x="550" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">
    Selvi Enterprise Steel &amp; Cement Management System
  </text>
  
  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- ==================== EXTERNAL ENTITIES ==================== -->
  
  <!-- Customer Entity (Left) -->
  <rect x="50" y="200" width="130" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="115" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="black">CUSTOMER</text>
  
  <!-- Admin Entity (Right) -->
  <rect x="920" y="200" width="130" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="985" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="black">ADMIN</text>
  
  <!-- ==================== PROCESSES ==================== -->
  
  <!-- Process 1.0: User Authentication -->
  <circle cx="280" cy="230" r="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="280" y="218" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">1.0</text>
  <text x="280" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">User</text>
  <text x="280" y="250" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Authentication</text>
  
  <!-- Process 2.0: Product Browsing & Cart -->
  <circle cx="280" cy="400" r="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="280" y="385" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">2.0</text>
  <text x="280" y="402" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Product Browsing</text>
  <text x="280" y="417" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">&amp; Cart</text>
  
  <!-- Process 3.0: Order Processing -->
  <circle cx="550" cy="400" r="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="550" y="388" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">3.0</text>
  <text x="550" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Order</text>
  <text x="550" y="420" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Processing</text>
  
  <!-- Process 4.0: Admin Management -->
  <circle cx="820" cy="230" r="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="820" y="218" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">4.0</text>
  <text x="820" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Admin</text>
  <text x="820" y="250" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Management</text>
  
  <!-- ==================== DATA STORES ==================== -->
  
  <!-- D1: User Database -->
  <rect x="180" y="580" width="200" height="50" fill="white" stroke="black" stroke-width="2"/>
  <line x1="180" y1="600" x2="380" y2="600" stroke="black" stroke-width="1"/>
  <text x="200" y="595" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="black">D1</text>
  <text x="280" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">User Database</text>
  
  <!-- D2: Product Database -->
  <line x1="450" y1="580" x2="650" y2="580" stroke="black" stroke-width="2"/>
  <line x1="450" y1="580" x2="450" y2="630" stroke="black" stroke-width="2"/>
  <line x1="650" y1="580" x2="650" y2="630" stroke="black" stroke-width="2"/>
  <line x1="450" y1="630" x2="650" y2="630" stroke="black" stroke-width="2"/>
  <line x1="450" y1="600" x2="650" y2="600" stroke="black" stroke-width="1"/>
  <text x="470" y="595" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="black">D2</text>
  <text x="550" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">Product Database</text>
  
  <!-- D3: Order Database -->
  <line x1="720" y1="580" x2="920" y2="580" stroke="black" stroke-width="2"/>
  <line x1="720" y1="580" x2="720" y2="630" stroke="black" stroke-width="2"/>
  <line x1="920" y1="580" x2="920" y2="630" stroke="black" stroke-width="2"/>
  <line x1="720" y1="630" x2="920" y2="630" stroke="black" stroke-width="2"/>
  <line x1="720" y1="600" x2="920" y2="600" stroke="black" stroke-width="1"/>
  <text x="740" y="595" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="black">D3</text>
  <text x="820" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">Order Database</text>
  
  <!-- ==================== DATA FLOWS ==================== -->
  
  <!-- Customer → 1.0 User Authentication: Registration Data -->
  <line x1="180" y1="215" x2="218" y2="215" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="205" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Registration Data</text>
  
  <!-- Customer → 1.0 User Authentication: Login Credentials -->
  <line x1="180" y1="245" x2="218" y2="245" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="260" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Login Credentials</text>
  
  <!-- 1.0 User Authentication → Customer: Authentication Result -->
  <line x1="218" y1="195" x2="180" y2="195" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="115" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Authentication Result</text>
  
  <!-- 1.0 User Authentication → D1 User Database -->
  <line x1="260" y1="290" x2="240" y2="575" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="440" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Store User Data</text>
  
  <!-- D1 User Database → 1.0 User Authentication -->
  <line x1="280" y1="575" x2="295" y2="290" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="440" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Verify Credentials</text>
  
  <!-- Customer → 2.0 Product Browsing: Product Request -->
  <line x1="115" y1="260" x2="115" y2="380" stroke="black" stroke-width="1"/>
  <line x1="115" y1="380" x2="218" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="125" y="370" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Product Request</text>
  
  <!-- Customer → 2.0 Product Browsing: Cart Data -->
  <line x1="115" y1="260" x2="115" y2="420" stroke="black" stroke-width="1"/>
  <line x1="115" y1="420" x2="218" y2="420" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="125" y="435" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Cart Data</text>
  
  <!-- 2.0 Product Browsing → Customer: Product Info -->
  <line x1="218" y1="400" x2="50" y2="400" stroke="black" stroke-width="1"/>
  <line x1="50" y1="400" x2="50" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="55" y="330" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Product Info</text>
  
  <!-- 2.0 Product Browsing → D2 Product Database -->
  <line x1="310" y1="455" x2="480" y2="575" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="520" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Product Query</text>
  
  <!-- D2 Product Database → 2.0 Product Browsing -->
  <line x1="510" y1="575" x2="330" y2="455" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="500" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Product Data</text>
  
  <!-- 2.0 Product Browsing → 3.0 Order Processing: Checkout Details -->
  <line x1="342" y1="400" x2="488" y2="400" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Checkout Details</text>
  
  <!-- 3.0 Order Processing → 2.0: Order Confirmation -->
  <line x1="488" y1="420" x2="342" y2="420" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="438" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Order Confirmation</text>
  
  <!-- 3.0 Order Processing → Customer: Order Confirmation -->
  <path d="M 490 400 Q 400 320 115 270" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="305" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Order Confirmation</text>
  
  <!-- 3.0 Order Processing → D3 Order Database -->
  <line x1="580" y1="455" x2="780" y2="575" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Store Order</text>
  
  <!-- D3 Order Database → 3.0 Order Processing -->
  <line x1="810" y1="575" x2="600" y2="455" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="720" y="500" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Order Data</text>
  
  <!-- Admin → 4.0 Admin Management: Product Updates -->
  <line x1="920" y1="215" x2="882" y2="215" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="885" y="205" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Product Updates</text>
  
  <!-- Admin → 4.0 Admin Management: Order Updates -->
  <line x1="920" y1="230" x2="882" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="885" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Order Updates</text>
  
  <!-- Admin → 4.0 Admin Management: User Management -->
  <line x1="920" y1="245" x2="882" y2="245" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="885" y="260" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">User Management</text>
  
  <!-- 4.0 Admin Management → Admin: Reports & Records -->
  <line x1="882" y1="195" x2="920" y2="195" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="885" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Reports &amp; Records</text>
  
  <!-- 4.0 Admin Management → D1 User Database -->
  <line x1="780" y1="275" x2="360" y2="575" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Manage Users</text>
  
  <!-- D1 User Database → 4.0 Admin Management -->
  <line x1="370" y1="580" x2="790" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="400" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">User Records</text>
  
  <!-- 4.0 Admin Management → D2 Product Database -->
  <line x1="820" y1="290" x2="600" y2="575" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="740" y="435" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Update Products</text>
  
  <!-- D2 Product Database → 4.0 Admin Management -->
  <line x1="620" y1="580" x2="835" y2="290" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="755" y="455" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Product Records</text>
  
  <!-- 4.0 Admin Management → D3 Order Database -->
  <line x1="850" y1="285" x2="865" y2="575" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="870" y="435" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Update Orders</text>
  
  <!-- D3 Order Database → 4.0 Admin Management -->
  <line x1="890" y1="575" x2="870" y2="290" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="435" font-family="Arial, sans-serif" font-size="9" text-anchor="start" fill="black">Order Records</text>
  
  <!-- ==================== LEGEND ==================== -->
  <rect x="50" y="700" width="320" height="130" fill="white" stroke="black" stroke-width="1"/>
  <text x="210" y="725" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">LEGEND</text>
  
  <!-- External Entity Symbol -->
  <rect x="70" y="740" width="50" height="28" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="135" y="760" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">External Entity</text>
  
  <!-- Process Symbol -->
  <circle cx="95" cy="795" r="16" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="135" y="800" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">Process</text>
  
  <!-- Data Store Symbol -->
  <line x1="230" y1="745" x2="300" y2="745" stroke="black" stroke-width="1.5"/>
  <line x1="230" y1="745" x2="230" y2="770" stroke="black" stroke-width="1.5"/>
  <line x1="300" y1="745" x2="300" y2="770" stroke="black" stroke-width="1.5"/>
  <line x1="230" y1="770" x2="300" y2="770" stroke="black" stroke-width="1.5"/>
  <line x1="230" y1="755" x2="300" y2="755" stroke="black" stroke-width="1"/>
  <text x="310" y="762" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">Data Store</text>
  
  <!-- Data Flow Symbol -->
  <line x1="230" y1="800" x2="300" y2="800" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="805" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">Data Flow</text>
  
  <!-- Process Summary Box -->
  <rect x="400" y="700" width="300" height="130" fill="white" stroke="black" stroke-width="1"/>
  <text x="550" y="725" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">PROCESSES</text>
  <text x="420" y="750" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">1.0 User Authentication</text>
  <text x="420" y="770" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">2.0 Product Browsing &amp; Cart</text>
  <text x="420" y="790" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">3.0 Order Processing</text>
  <text x="420" y="810" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">4.0 Admin Management</text>
  
  <!-- Data Stores Summary Box -->
  <rect x="730" y="700" width="320" height="130" fill="white" stroke="black" stroke-width="1"/>
  <text x="890" y="725" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">DATA STORES</text>
  <text x="750" y="755" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">D1 - User Database</text>
  <text x="750" y="780" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">D2 - Product Database</text>
  <text x="750" y="805" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="black">D3 - Order Database</text>
</svg>